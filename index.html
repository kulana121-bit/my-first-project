<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #addBtn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #addBtn:hover {
            background: #5568d3;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: #f0f0f0;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .task-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .task-main {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            font-size: 16px;
            color: #333;
        }

        .task-details {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #666;
            margin-left: 30px;
            flex-wrap: wrap;
        }

        .task-detail {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .task-detail label {
            font-weight: 500;
        }

        .task-detail select,
        .task-detail input[type="time"] {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        .weekday-selector {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .weekday-btn {
            width: 30px;
            height: 30px;
            border: 2px solid #ddd;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .weekday-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .weekday-btn:hover {
            border-color: #667eea;
        }

        .delete-btn {
            padding: 8px 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 0;
        }

        .task-count {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 14px;
        }

        .notification-banner {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification-banner h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .notification-banner ul {
            list-style: disc;
            margin-left: 20px;
        }

        .notification-banner button {
            margin-top: 15px;
            padding: 8px 20px;
            background: white;
            color: #ff6b6b;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .notification-banner button:hover {
            background: #f0f0f0;
        }

        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 50px;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .sound-toggle:hover {
            background: #667eea;
            color: white;
        }

        .sound-toggle.muted {
            background: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 To-Do List</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." autofocus>
            <button id="addBtn">Add</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
        
        <div class="task-count" id="taskCount"></div>
    </div>

    <button class="sound-toggle" id="soundToggle" title="Toggle notification sound">🔔</button>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const taskCount = document.getElementById('taskCount');
        const soundToggle = document.getElementById('soundToggle');

        // Sound settings
        let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
        updateSoundIcon();

        // Audio context for notification sound
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNotificationSound() {
            if (!soundEnabled) return;
            
            initAudio();
            
            // Create a pleasant alert sound using Web Audio API
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
            oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
            oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function updateSoundIcon() {
            soundToggle.textContent = soundEnabled ? '🔔' : '🔕';
            soundToggle.className = `sound-toggle ${soundEnabled ? '' : 'muted'}`;
            soundToggle.title = soundEnabled ? 'Disable notification sound' : 'Enable notification sound';
        }

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('soundEnabled', soundEnabled);
            updateSoundIcon();
            if (soundEnabled) {
                playNotificationSound();
            }
        });

        // Weekday constants
        const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        // Load tasks from localStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Get today's weekday index (0-6)
        function getTodayWeekday() {
            return new Date().getDay();
        }

        // Check if task should repeat today
        function shouldRepeatToday(task) {
            if (!task.repeat) return false;
            
            const today = getTodayWeekday();
            
            if (task.repeat === 'daily') {
                return true;
            } else if (task.repeat === 'custom' && task.weekdays) {
                return task.weekdays.includes(today);
            }
            
            return false;
        }

        // Reset completed status for repeating tasks
        function resetRepeatingTasks() {
            const lastResetDate = localStorage.getItem('lastResetDate');
            const today = new Date().toDateString();
            
            if (lastResetDate !== today) {
                let changed = false;
                tasks.forEach(task => {
                    if (task.repeat && task.completed) {
                        if (shouldRepeatToday(task)) {
                            task.completed = false;
                            changed = true;
                        }
                    }
                });
                
                if (changed) {
                    saveTasks();
                    renderTasks();
                }
                
                localStorage.setItem('lastResetDate', today);
            }
        }

        // Check for overdue reminders
        function checkReminders() {
            const now = new Date();
            const currentTime = now.toTimeString().substring(0, 5); // HH:MM format
            const today = getTodayWeekday();
            
            let overdueTasks = [];
            
            tasks.forEach(task => {
                if (task.completed) return;
                
                // Check if task has a reminder time
                if (task.reminderTime) {
                    const shouldShowToday = !task.repeat || shouldRepeatToday(task);
                    
                    if (shouldShowToday && task.reminderTime === currentTime) {
                        overdueTasks.push(task.text);
                    }
                }
            });
            
            if (overdueTasks.length > 0) {
                showNotification(overdueTasks);
                playNotificationSound();
            }
        }

        // Show notification banner
        function showNotification(taskList) {
            // Remove existing notifications
            const existing = document.querySelector('.notification-banner');
            if (existing) existing.remove();
            
            const banner = document.createElement('div');
            banner.className = 'notification-banner';
            
            let html = '<h3>⏰ Reminder!</h3><p>You haven\'t completed these tasks:</p><ul>';
            taskList.forEach(task => {
                html += `<li>${escapeHtml(task)}</li>`;
            });
            html += '</ul><button onclick="this.parentElement.remove()">Dismiss</button>';
            
            banner.innerHTML = html;
            document.body.appendChild(banner);
            
            // Auto-remove after 30 seconds
            setTimeout(() => {
                if (banner.parentElement) banner.remove();
            }, 30000);
        }

        // Render tasks
        function renderTasks() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">No tasks yet. Add one above!</div>';
            } else {
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    
                    let repeatInfo = '';
                    if (task.repeat === 'daily') {
                        repeatInfo = '<span>🔄 Daily</span>';
                    } else if (task.repeat === 'custom' && task.weekdays) {
                        const days = task.weekdays.map(d => WEEKDAYS[d]).join(', ');
                        repeatInfo = `<span>🔄 ${days}</span>`;
                    }
                    
                    let reminderInfo = '';
                    if (task.reminderTime) {
                        reminderInfo = `<span>⏰ ${task.reminderTime}</span>`;
                    }
                    
                    li.innerHTML = `
                        <div class="task-left">
                            <div class="task-main">
                                <input type="checkbox" class="task-checkbox" 
                                    ${task.completed ? 'checked' : ''} 
                                    onchange="toggleTask(${index})">
                                <span class="task-text">${escapeHtml(task.text)}</span>
                            </div>
                            <div class="task-details">
                                <div class="task-detail">
                                    <label>Repeat:</label>
                                    <select onchange="updateRepeat(${index}, this.value)">
                                        <option value="">Never</option>
                                        <option value="daily" ${task.repeat === 'daily' ? 'selected' : ''}>Daily</option>
                                        <option value="custom" ${task.repeat === 'custom' ? 'selected' : ''}>Custom Days</option>
                                    </select>
                                </div>
                                ${task.repeat === 'custom' ? `
                                <div class="task-detail">
                                    <div class="weekday-selector">
                                        ${WEEKDAYS.map((day, i) => `
                                            <button class="weekday-btn ${task.weekdays && task.weekdays.includes(i) ? 'selected' : ''}" 
                                                onclick="toggleWeekday(${index}, ${i})">${day.charAt(0)}</button>
                                        `).join('')}
                                    </div>
                                </div>
                                ` : ''}
                                <div class="task-detail">
                                    <label>Reminder:</label>
                                    <input type="time" value="${task.reminderTime || ''}" 
                                        onchange="updateReminder(${index}, this.value)">
                                </div>
                                ${repeatInfo}${reminderInfo}
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
                    `;
                    
                    taskList.appendChild(li);
                });
            }

            updateTaskCount();
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Update task count
        function updateTaskCount() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            taskCount.textContent = `${completed} of ${total} tasks completed`;
        }

        // Add task
        function addTask() {
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ 
                    text, 
                    completed: false,
                    repeat: null,
                    weekdays: [],
                    reminderTime: null
                });
                saveTasks();
                renderTasks();
                taskInput.value = '';
                taskInput.focus();
            }
        }

        // Toggle task completion
        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        };

        // Update repeat setting
        window.updateRepeat = function(index, value) {
            tasks[index].repeat = value || null;
            if (value !== 'custom') {
                tasks[index].weekdays = [];
            } else if (!tasks[index].weekdays) {
                tasks[index].weekdays = [];
            }
            saveTasks();
            renderTasks();
        };

        // Toggle weekday selection
        window.toggleWeekday = function(index, weekday) {
            if (!tasks[index].weekdays) {
                tasks[index].weekdays = [];
            }
            
            const idx = tasks[index].weekdays.indexOf(weekday);
            if (idx > -1) {
                tasks[index].weekdays.splice(idx, 1);
            } else {
                tasks[index].weekdays.push(weekday);
                tasks[index].weekdays.sort();
            }
            
            saveTasks();
            renderTasks();
        };

        // Update reminder time
        window.updateReminder = function(index, time) {
            tasks[index].reminderTime = time || null;
            saveTasks();
        };

        // Delete task
        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        };

        // Event listeners
        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Initialize
        resetRepeatingTasks();
        renderTasks();

        // Check reminders every minute
        setInterval(checkReminders, 60000);
        
        // Also check on page load
        setTimeout(checkReminders, 1000);
    </script>
</body>
</html>
